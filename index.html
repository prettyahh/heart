```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: #080003;
  display: flex;
  justify-content: center;
  align-items: center;
}

#heart {
  position: relative;
  width: min(95vw, 550px);
  height: min(90vh, 550px);
  filter: drop-shadow(0 0 12px #ff1744);
}

.love {
  position: absolute;
  transform: translate(-50%, -50%);
  color: #ff3157;
  white-space: nowrap;
  font-family: Arial, sans-serif;
  font-size: clamp(8px, 2.2vw, 12px);
  text-shadow: 0 0 5px #ff1744;
  opacity: 0;
  animation: appear 1.5s ease forwards;
}

@keyframes appear {
  to {
    opacity: 0.95;
  }
}

#heart:hover {
  filter: drop-shadow(0 0 20px #ff1744);
}

</style>
</head>

<body>

<div id="heart"></div>

<script>
const phrases = [
  "I love you",
  "Te amo",
  "Je t'aime",
  "Ich liebe dich",
  "Ti amo",
  "Eu te amo",
  "Main tumse pyaar karta hoon",
  "मैं तुमसे प्यार करता हूँ",
  "আমি তোমাকে ভালোবাসি",
  "我爱你",
  "愛してる",
  "사랑해",
  "Я тебя люблю",
  "Seni seviyorum",
  "Mahal kita",
  "Kocham cię",
  "Ik hou van jou",
  "Jeg elsker deg",
  "Jeg elsker dig",
  "Volim te",
  "Te quiero",
  "أحبك",
  "ฉันรักคุณ",
  "Ngiyakuthanda",
  "Ninakupenda",
  "Wo ai ni",
  "Minä rakastan sinua",
  "T'estimo",
  "Tá grá agam duit",
  "I love you forever",
  "You are my favourite",
  "Meri jaan",
  "My bebi",
  "I choose you",
  "Always yours"
];

const heart = document.getElementById("heart");

function createHeart() {
  heart.innerHTML = "";

  const points = [];
  const total = 190;

  while (points.length < total) {
    const x = Math.random() * 2.4 - 1.2;
    const y = Math.random() * 2.4 - 1.2;

    const equation =
      Math.pow(x * x + y * y - 1, 3) -
      x * x * y * y * y;

    if (equation <= 0) {
      points.push({ x, y });
    }
  }

  points.forEach((point, index) => {
    const span = document.createElement("span");

    span.className = "love";
    span.textContent =
      phrases[Math.floor(Math.random() * phrases.length)];

    span.style.left =
      ((point.x + 1.2) / 2.4 * 100) + "%";

    span.style.top =
      ((1.2 - point.y) / 2.4 * 100) + "%";

    span.style.animationDelay =
      (index * 0.035) + "s";

    heart.appendChild(span);
  });
}

createHeart();
window.addEventListener("resize", createHeart);
</script>

</body>
</html>
```
