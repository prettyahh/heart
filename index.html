<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080003;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#heart {
  width: min(96vw, 520px);
  height: min(96vw, 520px);
  position: relative;
  filter: drop-shadow(0 0 7px #ff1744);
}

.love {
  position: absolute;
  transform: translate(-50%, -50%);
  color: #ff3157;
  font-family: Arial, sans-serif;
  font-size: clamp(8px, 1.9vw, 11px);
  line-height: 1;
  white-space: nowrap;
  text-shadow: 0 0 6px #ff1744;
  opacity: 0;
  animation: appear 1s ease forwards;
  pointer-events: none;
}

@keyframes appear {
  to { opacity: 1; }
}

#heart:hover {
  filter: drop-shadow(0 0 13px #ff1744);
}

</style>
</head>

<body>

<div id="heart"></div>

<script>
const phrases = [
  "I love you",
  "Te amo",
  "Je t'aime",
  "Ich liebe dich",
  "Ti amo",
  "Eu te amo",
  "Main tumse pyaar karta hoon",
  "मैं तुमसे प्यार करता हूँ",
  "我爱你",
  "愛してる",
  "사랑해",
  "Я тебя люблю",
  "Seni seviyorum",
  "Mahal kita",
  "Kocham cię",
  "Ik hou van jou",
  "Jeg elsker deg",
  "Volim te",
  "Te quiero",
  "أحبك",
  "ฉันรักคุณ",
  "Wo ai ni",
  "Meri jaan",
  "My bebi",
  "Forever yours",
  "I choose you"
];

const heart = document.getElementById("heart");

function createHeart() {
  heart.innerHTML = "";

  const size = 100;
  const step = 4.8;
  let index = 0;

  // Regular rows preserve the outline of the heart.
  for (let py = 90; py >= -90; py -= step) {
    for (let px = -100; px <= 100; px += step) {

      const x = px / 75;
      const y = py / 75;

      const shape =
        Math.pow(x * x + y * y - 1, 3) -
        x * x * y * y * y;

      if (shape <= 0) {
        const span = document.createElement("span");
        span.className = "love";

        span.textContent =
          phrases[Math.floor(Math.random() * phrases.length)];

        span.style.left = (50 + px * 0.43) + "%";
        span.style.top = (50 - py * 0.43) + "%";
        span.style.animationDelay = (index * 0.008) + "s";

        heart.appendChild(span);
        index++;
      }
    }
  }
}

createHeart();
window.addEventListener("resize", createHeart);
</script>

</body>
</html>
